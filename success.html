<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      const tema = localStorage.getItem('luiza-portfolio-theme');
      if (tema === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Luiza Paolinelli">
  <meta name="description" content="Mensagem enviada com sucesso. Obrigada pelo contato.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">

  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@300;400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Folha de estilo própria -->
  <link rel="stylesheet" href="./assets/css/styles.css">

  <title>Mensagem enviada · Luiza Paolinelli</title>
</head>

<body>
  <!-- Cabeçalho da Página (header) -->
  <header>
    <div class="wrap">
      <a class="brand" href="index.html#topo">
        Luiza <span>Paolinelli</span>
        <img src="./assets/img/manga.png" alt="Logo Luiza Paolinelli" class="brand-logo">
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#formacao">Formação</a></li>
          <li><a href="index.html#trajetoria">Trajetória</a></li>
          <li><a href="index.html#projetos">Projetos</a></li>
          <li><a href="index.html#competencias">Competências</a></li>
          <li><a href="index.html#certificacoes">Certificações</a></li>
          <li><a href="index.html#contato">Contato</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar modo escuro">🌙</button>
      </div>
    </div>
  </header>

  <!-- Seção Principal da Página (main) -->
  <main>

    <!-- Mensagem de Sucesso -->
    <section class="success-container">

      <div class="success-media">
        <img src="./assets/img/success-01-light.png" alt="Ilustração comemorando o envio da mensagem" class="success-image theme-img-light">
        <img src="./assets/img/success-01-dark.png" alt="Ilustração comemorando o envio da mensagem" class="success-image theme-img-dark">
      </div>

      <div class="success-content">
        <span class="eyebrow">Mensagem enviada</span>
        <h1>Email Enviado com sucesso!</h1>
        <h2>Obrigada por entrar em contato. Logo mais retorno sua mensagem.</h2>
        <a class="botao" href="index.html">Voltar para o início</a>
      </div>

    </section>

  </main>

  <!-- Rodapé da Página (footer) -->
  <footer>
    Desenvolvido por Luiza Paolinelli - 2026
  </footer>

  <!-- Script JavaScript -->
  <script src="./assets/js/scripts.js"></script>

</body>

</html>
